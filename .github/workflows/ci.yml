name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        if: github.event_name == 'pull_request'
        run: |
          # 检查 PR 中的 commit 消息是否符合 Conventional Commits 规范
          COMMITS=$(git log --format="%s" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"
          while IFS= read -r commit; do
            # 跳过 merge commit
            if [[ "$commit" == Merge* ]]; then
              continue
            fi
            if [[ ! "$commit" =~ $PATTERN ]]; then
              echo "❌ 不符合规范的 commit: $commit"
              echo "格式要求: <type>(<scope>): <subject>"
              exit 1
            fi
          done <<< "$COMMITS"
          echo "✅ 所有 commit 消息格式正确"

      - name: Check for sensitive files
        run: |
          # 检查是否有敏感文件被提交（排除模板文件）
          SENSITIVE_FILES=$(git ls-files -- \
            ':(glob)**/.env' ':(glob)**/.env.*' ':(glob)**/config.json' \
            ':(glob)**/*.pem' ':(glob)**/*.key' ':(glob)**/credentials*' \
            ':(exclude,glob)**/.env.example' \
            ':(exclude,glob)**/.env.template' \
            ':(exclude,glob)**/.env.sample')
          if [ -n "$SENSITIVE_FILES" ]; then
            printf '❌ 发现可能包含敏感信息的文件:\n%s\n' "$SENSITIVE_FILES"
            echo "请移除敏感文件或将其添加到 .gitignore"
            exit 1
          fi
          echo "✅ 未发现敏感文件"

      - name: Verify skill structure
        run: |
          # 验证 skill 目录结构（单层: skills/<skill-name>/）
          for skill in skills/*/; do
            if [ -d "$skill" ]; then
              skill_name=$(basename "$skill")
              if [ ! -f "$skill/SKILL.md" ]; then
                echo "❌ $skill_name 缺少 SKILL.md"
                exit 1
              fi
              echo "✅ $skill_name 结构检查通过"
            fi
          done
